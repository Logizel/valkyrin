[package]
name = "valkyrin-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
bigdecimal = "0.4.10"
regex = "1.12.4"
rust_decimal = "1.42.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "mysql", "sqlite", "any"] }
tokio = { version = "1.52.3", features = ["full"] }
tree-sitter = "0.26.9"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"
uuid = { version = "1.23.2", features = ["v4"] }
dotenvy = "0.15"

[dev-dependencies]
proptest = "1.0"
