name: Release Valkyrin

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-and-release:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: valkyrin-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: valkyrin-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: valkyrin-windows.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Bun (Frontend Compilation)
        uses: oven-sh/setup-bun@v1

      - name: Build React Canvas
        working-directory: ./valkyrin-ui
        run: bun install && bun run build

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Compile Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename Binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv valkyrin-cli.exe ../../../${{ matrix.artifact_name }}
          else
            mv valkyrin-cli ../../../${{ matrix.artifact_name }}
          fi

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
